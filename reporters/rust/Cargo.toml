[package]
name = "ai-agents"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Low-overhead local agent reporting daemon"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "signal", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
